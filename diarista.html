<html lang="pt-BR">

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>

<style>
:root{
  --navy:#003B5C; --blue:#005B82; --blue-light:#00A3E0; --yellow:#F5C400;
  --white:#FFFFFF; --bg:#F4F6F8; --gray:#6B7280; --dark:#1F2937;
  --green:#16A34A; --red:#DC2626;
  --radius:10px; --shadow:0 1px 3px rgba(0,59,92,.08), 0 1px 2px rgba(0,59,92,.06);
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--dark);font-size:14px;}
#app{display:flex;min-height:100vh;}

/* Sidebar */
#sidebar{width:236px;background:var(--navy);color:#fff;flex-shrink:0;display:flex;flex-direction:column;}
#sidebar .brand{padding:22px 18px;border-bottom:1px solid rgba(255,255,255,.12);}
#sidebar .brand .logo{font-weight:800;font-size:17px;letter-spacing:.5px;color:#fff;}
#sidebar .brand .logo span{color:var(--yellow);}
#sidebar .brand .sub{font-size:11px;color:#b7c8d3;margin-top:2px;}
#sidebar nav{flex:1;padding:10px 0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;color:#cfe0e8;cursor:pointer;font-size:13.5px;border-left:3px solid transparent;transition:.15s;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--blue);color:#fff;border-left-color:var(--yellow);font-weight:600;}
.nav-item .ic{width:18px;text-align:center;font-size:14px;}
#sidebar .foot{padding:14px 18px;font-size:11px;color:#8fa7b3;border-top:1px solid rgba(255,255,255,.1);}

/* Main */
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{background:#fff;border-bottom:1px solid #e5e9ed;padding:14px 26px;display:flex;justify-content:space-between;align-items:center;}
#topbar h1{font-size:18px;margin:0;color:var(--navy);}
#topbar .meta{font-size:12px;color:var(--gray);}
#content{padding:22px 26px;flex:1;}

/* Cards */
.cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin-bottom:24px;}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 2px rgba(0,59,92,.05), 0 4px 14px rgba(0,59,92,.06);padding:18px 16px;border-top:3px solid var(--blue);transition:box-shadow .15s, transform .15s;}
.card:hover{box-shadow:0 2px 4px rgba(0,59,92,.06), 0 8px 20px rgba(0,59,92,.09);transform:translateY(-1px);}
.card .label{font-size:10.5px;color:var(--gray);text-transform:uppercase;letter-spacing:.6px;font-weight:700;}
.card .value{font-size:27px;font-weight:800;color:var(--navy);margin-top:6px;letter-spacing:-.5px;}
.card.meli{border-top-color:var(--yellow);}
.card.kn{border-top-color:var(--blue-light);}
.card.tsi{border-top-color:var(--gray);}
.card.total{border-top-color:var(--navy);}

.panel{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px;}
.panel h2{font-size:15px;margin:0 0 14px;color:var(--navy);}
.panel h3{font-size:13px;margin:16px 0 8px;color:var(--navy);}

/* Buttons/inputs */
button{cursor:pointer;font-family:inherit;}
.btn{background:var(--blue);color:#fff;border:none;padding:9px 16px;border-radius:7px;font-size:13px;font-weight:600;}
.btn:hover{background:var(--navy);}
.btn.secondary{background:#fff;color:var(--blue);border:1px solid var(--blue);}
.btn.secondary:hover{background:#eef6fa;}
.btn.yellow{background:var(--yellow);color:var(--navy);}
.btn.danger{background:#fff;color:var(--red);border:1px solid var(--red);}
.btn.sm{padding:5px 10px;font-size:12px;}
input,select,textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid #d7dee3;border-radius:6px;background:#fff;color:var(--dark);}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue-light);}
label{font-size:12px;color:var(--gray);font-weight:600;display:block;margin-bottom:4px;}
.field{margin-bottom:12px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}

table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;background:var(--bg);color:var(--navy);padding:9px 10px;font-weight:700;border-bottom:2px solid #e5e9ed;white-space:nowrap;}
td{padding:8px 10px;border-bottom:1px solid #eef1f3;white-space:nowrap;}
tr:hover td{background:#f8fbfd;}
.table-wrap{overflow-x:auto;}
table.table-compact{width:auto;min-width:100%;}
table.table-compact th,table.table-compact td{padding:7px 8px;}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.pill.ativo{background:#e7f7ec;color:var(--green);}
.pill.inativo{background:#fdecec;color:var(--red);}
.pill.encontrado{background:#e7f7ec;color:var(--green);}
.pill.novo{background:#fff8e1;color:#8a6d00;}
.pill.duplicidade{background:#fdecec;color:var(--red);}
.pill.empresa{background:#eef6fa;color:var(--blue);}
.link{color:var(--blue);cursor:pointer;text-decoration:underline;}
.colcopy{cursor:pointer;opacity:.45;font-size:12px;margin-left:4px;user-select:none;}
.colcopy:hover{opacity:1;}
.muted{color:var(--gray);}
.small{font-size:11.5px;}

.alert{padding:11px 14px;border-radius:8px;font-size:12.5px;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start;}
.alert.ok{background:#e7f7ec;color:#1a6b34;}
.alert.warn{background:#fff8e1;color:#8a6d00;}
.alert.err{background:#fdecec;color:#a12727;}
.alert.info{background:#eef6fa;color:var(--blue);}

.modal-bg{position:fixed;inset:0;background:rgba(0,20,30,.45);display:flex;align-items:center;justify-content:center;z-index:100;}
.modal{background:#fff;border-radius:12px;width:480px;max-width:92vw;max-height:88vh;overflow:auto;padding:22px;}
.modal h3{margin-top:0;color:var(--navy);}
.modal-close{float:right;cursor:pointer;font-size:18px;color:var(--gray);}

.tabs{display:flex;gap:4px;border-bottom:1px solid #e5e9ed;margin-bottom:16px;}
.tab{padding:9px 16px;font-size:13px;color:var(--gray);cursor:pointer;border-bottom:2px solid transparent;font-weight:600;}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);}

.stepper{display:flex;gap:0;margin-bottom:20px;}
.step{flex:1;text-align:center;padding:8px 4px;font-size:11.5px;color:var(--gray);border-bottom:3px solid #e5e9ed;font-weight:600;}
.step.active{color:var(--blue);border-bottom-color:var(--blue);}
.step.done{color:var(--green);border-bottom-color:var(--green);}

.dropzone{border:2px dashed #c7d3da;border-radius:10px;padding:30px;text-align:center;color:var(--gray);cursor:pointer;background:#fafcfd;}
.dropzone:hover{border-color:var(--blue-light);}
.chip{display:inline-block;background:var(--bg);border:1px solid #dfe6ea;padding:4px 10px;border-radius:20px;font-size:12px;margin:2px;}
.searchbox{width:100%;padding:11px 14px;font-size:14px;border-radius:8px;}
.right{text-align:right;}
.flex{display:flex;align-items:center;}
.gap8{gap:8px;}
.gap12{gap:12px;}
.between{justify-content:space-between;}
.mt8{margin-top:8px;}
.mt16{margin-top:16px;}
.mb0{margin-bottom:0;}
.w100{width:100%;}
.chart-box{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;}
.badge-count{background:var(--yellow);color:var(--navy);border-radius:20px;padding:1px 8px;font-size:11px;font-weight:800;margin-left:6px;}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:#c7d3da;border-radius:8px;}

.mini-line{height:36px;margin-top:7px;width:100%;filter:drop-shadow(0 0 5px var(--accent));overflow:visible}.mini-line path.line{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.mini-line path.area{fill:url(#g)}

.company-layout{display:grid;grid-template-columns:1.2fr .9fr;align-items:center;height:205px;gap:4px}.donut-svg{width:180px;max-width:100%;height:180px;margin:auto;filter:drop-shadow(0 0 13px rgba(0,142,255,.2))}.company-legend{display:grid;gap:16px;font-size:12px}.company-legend .row{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center}.company-legend i{width:10px;height:10px;border-radius:50%;box-shadow:0 0 10px currentColor}.company-legend b{font-size:14px;color:#fff}.company-legend small{color:#16e6ad;font-weight:700}

.kn-analytics{display:grid;grid-template-columns:1.55fr .9fr .9fr;gap:14px;margin-bottom:14px}.kn-analytics .panel{margin:0!important;min-height:250px}.kn-panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.kn-panel-head h2{margin:0!important;font-size:14px!important}.kn-chart{height:190px!important;max-height:190px!important}.kn-donut-wrap{height:190px;position:relative}.kn-donut-wrap canvas{height:190px!important}.kn-donut-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}.kn-donut-center strong{font-size:27px}.kn-donut-center span{font-size:10px;color:#9cb6c8}.status-line{display:grid;grid-template-columns:1fr 42px 1.4fr;align-items:center;gap:9px;margin:17px 0;font-size:12px}.status-line b{text-align:right}.status-track{height:9px;border-radius:99px;background:#17334a;overflow:hidden}.status-fill{height:100%;border-radius:99px;box-shadow:0 0 12px currentColor}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;box-shadow:0 0 10px currentColor}
.kn-table-panel{padding:14px!important}.kn-table-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}.kn-table-head h2{margin:0!important}.table-wrap{border:1px solid rgba(23,132,188,.22)!important;border-radius:9px!important;overflow:auto!important}table{color:#dbeaf4!important}th{background:#031221!important;color:#cbe9f8!important;border-color:#16405a!important;font-size:11px!important}td{border-color:rgba(30,86,119,.42)!important}tbody tr:hover td{background:rgba(0,176,255,.055)!important}.pill.empresa{background:#074c70!important;color:#6ee9ff!important;border:1px solid rgba(0,200,255,.25)}.status-present{color:#14e6ae;font-weight:700}.status-late{color:#ffd229;font-weight:700}.status-pending{color:#ff536b;font-weight:700}
@media(max-width:1250px){.cards-row.kn-kpis{grid-template-columns:repeat(3,1fr)!important}.kn-analytics{grid-template-columns:1fr 1fr}.kn-analytics>.panel:first-child{grid-column:1/-1}}@media(max-width:760px){#content{padding:12px!important}.kn-filterbar,.kn-analytics{grid-template-columns:1fr}.cards-row.kn-kpis{grid-template-columns:repeat(2,1fr)!important}.kn-analytics>.panel:first-child{grid-column:auto}.kn-welcome{align-items:flex-start;flex-direction:column}.kn-clock{margin-top:8px}}

<script>
/* ===================== SUPABASE CONNECTION ===================== */
const SUPABASE_URL = 'https://cnpcsovjomonctbggbac.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_1lqP4jYYMR96Aq8DX-DSHA_JKcGESRt';
let sb = null;
try{
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}catch(e){
  console.error('Falha ao iniciar conexao com o banco (Supabase):', e);
}

async function sbSelect(table){
  const {data, error} = await sb.from(table).select('*');
  if(error){ console.error('Erro ao carregar '+table, error); toast('Erro ao carregar dados do banco ('+table+'): '+error.message,'err'); return []; }
  return data || [];
}
// Busca um diarista direto no banco pelo CPF (não depende da lista DIARISTAS carregada em memória,
// que pode estar desatualizada se o cadastro foi feito depois que a página foi aberta).
async function sbFindDiaristaByCPF(cpf){
  const n = normalizeCPF(cpf);
  if(!n) return null;
  const {data, error} = await sb.from('diaristas').select('*').eq('cpf', n).limit(1);
  if(error){ console.error('Erro ao buscar diarista por CPF no banco', error); return null; }
  return (data && data[0]) || null;
}
async function sbInsert(table, row){
  const {data, error} = await sb.from(table).insert(row).select();
  if(error){ console.error('Erro ao inserir em '+table, error); toast('Erro ao salvar em '+table+': '+error.message,'err'); return null; }
  return data ? data[0] : null;
}
async function sbInsertMany(table, rows){
  if(!rows.length) return [];
  const {data, error} = await sb.from(table).insert(rows).select();
  if(error){ console.error('Erro ao inserir em '+table, error); toast('Erro ao salvar em '+table+': '+error.message,'err'); return []; }
  return data || [];
}
async function sbUpdate(table, id, patch){
  const {data, error} = await sb.from(table).update(patch).eq('id', id).select();
  if(error){ console.error('Erro ao atualizar '+table, error); toast('Erro ao atualizar '+table+': '+error.message,'err'); return null; }
  return data ? data[0] : null;
}
async function sbDelete(table, id){
  const {error} = await sb.from(table).delete().eq('id', id);
  if(error){ console.error('Erro ao excluir de '+table, error); toast('Erro ao excluir de '+table+': '+error.message,'err'); return false; }
  return true;
}

let DIARISTAS = [];
let HISTORICO = [];
let IMPORTS = [];
let DIST_DIARIA = []; // [{id, data, meli, kn, updated_at}] - divisão diária MELI x KN decidida com o cliente
let LOADED = false;

function distDia(dataISO){
  return DIST_DIARIA.find(d=>d.data===dataISO);
}

async function salvarDistribuicaoDia(dataISO, meli, kn){
  const patch = {meli, kn, updated_at:new Date().toISOString()};
  const existente = distDia(dataISO);
  if(existente){
    const upd = await sbUpdate('distribuicao_diaria', existente.id, patch);
    if(!upd) return false;
    Object.assign(existente, patch);
  } else {
    const inserted = await sbInsert('distribuicao_diaria', {data:dataISO, ...patch});
    if(!inserted) return false;
    DIST_DIARIA.push(inserted);
  }
  return true;
}

// Liga os inputs .dist-input de um container: ao editar MELI ou KN de um dia,
// calcula automaticamente o restante para a outra empresa (com base no Total do dia) e salva.
function attachDistInputHandler(container){
  container.addEventListener('change', async (e)=>{
    const inp = e.target.closest('.dist-input');
    if(!inp) return;
    const dataISO = inp.dataset.data;
    const total = parseInt(inp.dataset.total)||0;
    let val = parseInt(inp.value);
    if(isNaN(val) || val<0) val = 0;
    if(val>total) val = total;
    inp.value = val;
    const outro = total - val;
    const campo = inp.dataset.campo;
    const outroCampo = campo==='meli' ? 'kn' : 'meli';
    const outroInput = container.querySelector(`.dist-input[data-data="${CSS.escape(dataISO)}"][data-campo="${outroCampo}"]`);
    if(outroInput) outroInput.value = outro;
    const meli = campo==='meli' ? val : outro;
    const kn = campo==='kn' ? val : outro;
    const ok = await salvarDistribuicaoDia(dataISO, meli, kn);
    if(ok) toast('Distribuição de '+fmtDateBR(dataISO)+' salva.','ok');
  });
}


/* ===================== UTILS ===================== */
function uid(){ return 'id_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function onlyDigits(s){ return (s||'').toString().replace(/\D/g,''); }
function normalizeCPF(s){ return onlyDigits(s); }
function formatCPF(cpf){
  const d = onlyDigits(cpf);
  if(d.length!==11) return cpf || '';
  return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');
}
function maskCPF(cpf){
  const d = onlyDigits(cpf);
  if(d.length!==11) return cpf||'';
  return d.slice(0,3)+'.***.***-'+d.slice(9);
}
function normalizeName(s){
  return (s||'').toString()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toUpperCase().replace(/\s+/g,' ').trim();
}
const DIAS_SEMANA = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
function diaSemana(dataISO){
  const [y,m,d] = dataISO.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return DIAS_SEMANA[dt.getDay()];
}
function fmtDateBR(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function toast(msg, type){

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtHora(iso){
  if(!iso) return '-';
  try{
    const d = new Date(iso);
    return d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  }catch(e){ return '-'; }
}

function findDiaristaByCPF(cpf){
  const n = normalizeCPF(cpf);
  if(!n) return null;
  return DIARISTAS.find(d=>normalizeCPF(d.cpf)===n) || null;
}
function findDiaristaByName(nome){
  const n = normalizeName(nome);
  if(!n) return null;
  return DIARISTAS.find(d=>normalizeName(d.nome)===n) || null;
}

/* ===================== AGGREGATIONS ===================== */
function registrosDoDia(dataISO){
  return HISTORICO.filter(h=>h.data===dataISO);
}
function agregarDia(dataISO){
  const regs = registrosDoDia(dataISO);
  const agg = {total:regs.length, MELI:0, KN:0, TSI:0, T1:0, T2:0, T3:0};
  regs.forEach(r=>{
    if(agg[r.empresa]!==undefined) agg[r.empresa]+=1; else agg[r.empresa]=(agg[r.empresa]||0)+1;
    if(agg[r.turno]!==undefined) agg[r.turno]+=1;
  });
  return agg;
}
function empresasUsadas(){
  const s = new Set(['TSI','MELI','KN','HD']);
  DIARISTAS.forEach(d=>d.empresa && s.add(d.empresa));
  HISTORICO.forEach(h=>h.empresa && s.add(h.empresa));
  return Array.from(s);
}

  let bars='', labels=''; slots.forEach((h,i)=>{let x=x0+i*step;let ph=planned[i]/max*H,eh=entered[i]/max*H;bars+=`<rect class="bar-blue" x="${x}" y="${base-ph}" width="19" height="${ph}" rx="4"/><rect class="bar-green" x="${x+22}" y="${base-eh}" width="19" height="${eh}" rx="4"/><text x="${x+20}" y="188" text-anchor="middle">${h}</text><text x="${x+9}" y="${Math.max(13,base-ph-5)}" text-anchor="middle">${planned[i]}</text><text x="${x+31}" y="${Math.max(13,base-eh-5)}" text-anchor="middle">${entered[i]}</text>`});

    <div class="flex between mt16">
      <div>${isEdit?'<button class="btn danger sm" id="mDelete">Excluir cadastro</button>':''}</div>
      <div class="flex gap8"><button class="btn secondary" id="mCancel">Cancelar</button><button class="btn" id="mSave">Salvar</button></div>
    </div>
  </div>`;
  document.body.appendChild(bg);
  bg.querySelector('#mClose').onclick = ()=>bg.remove();
  bg.querySelector('#mCancel').onclick = ()=>bg.remove();
  if(isEdit) bg.querySelector('#mDelete').onclick = async ()=>{
    if(confirm('Excluir este diarista? O histórico de lançamentos será mantido.')){
      const ok = await sbDelete('diaristas', diarista.id);
      if(!ok) return;
      DIARISTAS = DIARISTAS.filter(d=>d.id!==diarista.id);
      bg.remove(); toast('Diarista excluído.','ok'); navigate();
    }
  };
  bg.querySelector('#mSave').onclick = async ()=>{
    const nome = bg.querySelector('#mNome').value.trim();
    const cpf = normalizeCPF(bg.querySelector('#mCpf').value);
    const empresa = bg.querySelector('#mEmpresa').value.trim().toUpperCase();
    if(!nome || !cpf || !empresa){ toast('Preencha os campos obrigatórios: Nome, CPF e Empresa.','err'); return; }
    if(cpf.length!==11){ toast('CPF inválido — deve conter 11 dígitos.','err'); return; }
    const dupCpf = DIARISTAS.find(d=>normalizeCPF(d.cpf)===cpf && (!isEdit || d.id!==diarista.id));
    if(dupCpf){ toast('Já existe um diarista cadastrado com este CPF.','err'); return; }
    const now = new Date().toISOString();
    const groot_id = bg.querySelector('#mGroot').value.trim();
    const ext = bg.querySelector('#mExt').value.trim();
    const cargo = bg.querySelector('#mCargo').value.trim()||'AUX';
    const status = bg.querySelector('#mStatus').value;
    if(isEdit){
      const patch = {nome, cpf, empresa, groot_id, ext, cargo, status, nome_normalizado:normalizeName(nome), updated_at:now};
      const updated = await sbUpdate('diaristas', diarista.id, patch);
      if(!updated) return;
      Object.assign(diarista, patch);
    } else {
      const inserted = await sbInsert('diaristas', {nome, cpf, empresa, groot_id, ext, cargo, status, nome_normalizado:normalizeName(nome), created_at:now, updated_at:now});
      if(!inserted) return;
      DIARISTAS.push(inserted);
    }
    bg.remove(); toast('Diarista salvo com sucesso.','ok'); navigate();
  };
}

/* ===================== IMPORTAR LISTAGEM ===================== */
const FIELD_ALIASES = {
  nome: ['nome','nome completo','diarista','colaborador','funcionario','funcionário'],
  cpf: ['cpf','cpf do diarista','documento','doc'],
  turno: ['turno'],
  horario_entrada: ['horario','horário','entrada','horario de entrada','horário de entrada','hora'],
  empresa: ['empresa'],
  groot_id: ['groot id','grootid','groot','id groot'],
  cargo: ['cargo','função','funcao'],
  data: ['data','dia'],
};
function guessField(header){
  const h = normalizeName(header).toLowerCase();
  for(const [field, aliases] of Object.entries(FIELD_ALIASES)){
    if(aliases.some(a=>h===a || h.includes(a))) return field;
  }
  return '';
}
function parseCSVText(text){
  const delim = text.includes('\t') ? '\t' : (text.split('\n')[0].split(';').length>1 ? ';' : ',');
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  return lines.map(l=>l.split(delim).map(c=>c.trim().replace(/^"|"$/g,'')));
}
// Detecta se a primeira linha colada/importada parece ser um valor de dado (ex: um CPF)
// em vez de um título de coluna — evita perder a primeira linha quando a lista não tem cabeçalho.
function inferFieldFromValue(cell){
  const c = String(cell||'').trim();
  if(!c) return '';
  const d = onlyDigits(c);
  if(d.length===11) return 'cpf';
  if(/^T[123]$/i.test(c)) return 'turno';
  if(/^\d{1,2}:\d{2}$/.test(c)) return 'horario_entrada';
  if(/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}$/.test(c) || /^\d{4}-\d{2}-\d{2}$/.test(c)) return 'data';
  if(/^\d{4,8}$/.test(d)) return 'groot_id';
  if(/[A-Za-zÀ-ÿ]/.test(c) && c.trim().includes(' ')) return 'nome';
  return '';
}
function rowLooksLikeData(row){
  return row.some(cell=>{
    if(guessField(cell)) return false; // combina com um rótulo de coluna conhecido — não conta como "dado"
    return inferFieldFromValue(cell)!=='';
  });
}
function splitHeaderAndData(allRows, forceHeaderless){
  if(!allRows || !allRows.length) return {headers:[], rawRows:[], headerless:false};
  const first = allRows[0];
  const temHeaderConhecido = first.some(cell=>guessField(cell)!=='');
  const headerless = forceHeaderless===true || (!temHeaderConhecido && forceHeaderless!==false && rowLooksLikeData(first));
  if(headerless){
    const labels = {nome:'Nome (detectado)', cpf:'CPF (detectado)', turno:'Turno (detectado)', horario_entrada:'Horário (detectado)', data:'Data (detectado)', groot_id:'GROOT ID (detectado)'};
    const headers = first.map((cell,i)=>{ const f=inferFieldFromValue(cell); return labels[f] || ('Coluna '+(i+1)); });
    return {headers, rawRows:allRows.slice(0), headerless:true};
  }
  return {headers:first.map(h=>String(h)), rawRows:allRows.slice(1), headerless:false};
}

// Leitor inteligente do relatório "Planejamento de Escala" (reports_Escala-..., reports_Escala5-...).
// O arquivo pode trazer título/metadados antes da tabela. Para o sistema, só importam
// os campos necessários para reconhecer o diarista e registrar o lançamento.
// Formatos aceitos:
//  - com coluna "Data" (ex.: 19/09/2026 05:00) ao lado do nome;
//  - SEM coluna Data, só com a "Chave" (ex.: CORDKN091020260500 => 09/10/2026 05:00),
//    seja na linha "Chave: ..." do topo, seja na coluna Chave de cada diarista.
function chaveEscalaParaDataHora(txt){
  const m=String(txt||'').toUpperCase().match(/[A-Z]+(\d{2})(\d{2})(\d{4})(\d{2})(\d{2})(?!\d)/);
  if(!m) return null;
  const d=+m[1], mo=+m[2], y=+m[3], h=+m[4], mi=+m[5];
  if(d<1||d>31||mo<1||mo>12||y<2000||h>23||mi>59) return null;
  return {data:`${m[3]}-${m[2]}-${m[1]}`, hora:`${m[4]}:${m[5]}`};
}
function parsePlanejamentoEscalaRows(rows){
  if(!rows || !rows.length) return null;
  let headerIdx = -1;
  let tituloPlanejamento = false;
  for(let i=0;i<Math.min(rows.length,20);i++){
    const norm = (rows[i]||[]).map(x=>normalizeName(String(x||'')).toLowerCase());
    if(norm.some(x=>/planejamento de escala/.test(x) || /^chave:/.test(x))) tituloPlanejamento = true;
    const temNome = norm.some(x=>x==='nome');
    const temCpf = norm.some(x=>x==='cpf');
    const temData = norm.some(x=>x==='data');
    const temChave = norm.some(x=>x==='chave');
    if(temNome && temCpf && (temData || temChave || tituloPlanejamento)){ headerIdx=i; break; }
  }
  if(headerIdx<0) return null;
  const originalHeaders=(rows[headerIdx]||[]).map(x=>String(x||'').trim());
  const normHeaders=originalHeaders.map(x=>normalizeName(x).toLowerCase());
  const idxNome=normHeaders.findIndex(x=>x==='nome');
  const idxCpf=normHeaders.findIndex(x=>x==='cpf');
  const idxEmail=normHeaders.findIndex(x=>x==='email' || x==='e-mail');
  const idxCel=normHeaders.findIndex(x=>x==='celular' || x==='telefone');
  const idxData=normHeaders.findIndex(x=>x==='data');
  const idxChave=normHeaders.findIndex(x=>x==='chave');
  if(idxNome<0 || idxCpf<0) return null;

  // Lê a empresa do cabeçalho/metadados do relatório, quando existir.
  // Ex.: "Site: CORDOVIL - SVC - KN" => empresa KN.
  let empresaMeta='';
  let dataChave=''; let horaChave=''; let chaveTexto=''; let totalChamados=null;
  for(let i=0;i<headerIdx;i++){
    for(const cell of (rows[i]||[])){
      const txt=String(cell||'').trim();
      // A chave também contém a DATA/HORA REAL do trabalho.
      // Ex.: CORDKN190920260500 => 19/09/2026 05:00.
      const kc=txt.match(/^Chave:\s*(\S+)/i);
      if(kc){ chaveTexto=kc[1]; const dh=chaveEscalaParaDataHora(kc[1]); if(dh){ dataChave=dh.data; horaChave=dh.hora; } }
      const sm=txt.match(/^Site:\s*(.+)$/i);
      if(sm){
        const partes=sm[1].split('-').map(x=>x.trim()).filter(Boolean);
        empresaMeta=(partes[partes.length-1]||'').toUpperCase();
      }
      const em=txt.match(/^Empresa:\s*(.+)$/i);
      if(em) empresaMeta=em[1].trim().toUpperCase();
      const tc=txt.match(/^Total\s+Chamados:\s*(\d+)/i);
      if(tc) totalChamados=Number(tc[1]);
    }
  }

  const out=[];
  for(let i=headerIdx+1;i<rows.length;i++){
    const r=rows[i]||[];
    const nome=String(r[idxNome]||'').trim();
    const cpf=String(r[idxCpf]||'').trim();
    if(!nome && !cpf) continue;
    // Ignora rodapé/metadados e qualquer linha que não seja pessoa.
    const primeira=String(r[0]||'').trim();
    if(/^gerado em/i.test(nome) || /^chave:/i.test(nome) || /^site:/i.test(nome) || /^gerado em/i.test(primeira)) continue;
    if(!cpf && !/[A-Za-zÀ-ÿ]{2,}\s+[A-Za-zÀ-ÿ]/.test(nome)) continue;
    // 1) Chave da própria linha (coluna "Chave"), 2) Chave do topo, 3) coluna Data da linha.
    const dhLinha = idxChave>=0 ? chaveEscalaParaDataHora(r[idxChave]) : null;
    const dataOriginal = idxData>=0 ? String(r[idxData]||'').trim() : '';
    // Ex.: 19/09/2026 05:00 -> Data 2026-09-19 e Horário 05:00.
    // Nunca usa a linha "Gerado em" como data de trabalho.
    const dm = dataOriginal.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})(?:\s+(\d{1,2}):(\d{2}))?/);
    let dataTrabalho = ''; let horaTrabalho = '';
    if(dm){
      let yy=dm[3]; if(yy.length===2) yy='20'+yy;
      dataTrabalho = `${yy}-${dm[2].padStart(2,'0')}-${dm[1].padStart(2,'0')}`;
      if(dm[4]!=null) horaTrabalho = `${dm[4].padStart(2,'0')}:${dm[5]}`;
    } else if(/^\d{4}-\d{2}-\d{2}/.test(dataOriginal)){
      dataTrabalho = dataOriginal.slice(0,10);
      const hm=dataOriginal.match(/(?:T|\s)(\d{1,2}):(\d{2})/); if(hm) horaTrabalho=`${hm[1].padStart(2,'0')}:${hm[2]}`;
    }
    out.push([
      nome,
      cpf,
      idxEmail>=0?String(r[idxEmail]||'').trim():'',
      idxCel>=0?String(r[idxCel]||'').trim():'',
      (dhLinha&&dhLinha.data) || dataChave || dataTrabalho || dataOriginal,
      (dhLinha&&dhLinha.hora) || horaChave || horaTrabalho
    ]);
  }
  if(!out.length) return null;
  return {headers:['Nome','CPF','Email','Celular','Data','Horário de entrada'], rawRows:out, smart:true, empresaMeta,
          chave:chaveTexto, dataChave, horaChave, totalChamados};
}
function splitDataHoraEscala(v){
  const s=String(v||'').trim();
  let data='', hora='';
  let m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})(?:\s+(\d{1,2}):(\d{2}))?/);
  if(m){
    let y=m[3]; if(y.length===2)y='20'+y;
    data=`${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    if(m[4]!=null) hora=`${m[4].padStart(2,'0')}:${m[5]}`;
  } else if(/^\d{4}-\d{2}-\d{2}/.test(s)){
    data=s.slice(0,10); const hm=s.match(/(?:T|\s)(\d{1,2}):(\d{2})/); if(hm) hora=`${hm[1].padStart(2,'0')}:${hm[2]}`;
  }
  return {data,hora};
}
function turnoPorHorario(h){
  const hh=parseInt(String(h||'').split(':')[0],10);
  if(Number.isNaN(hh)) return '';
  if(hh>=4 && hh<12) return 'T1';
  if(hh>=12 && hh<21) return 'T2';
  return 'T3';
}
function renderImportar(c){

    function handleFile(file){
      const reader = new FileReader();

        try{
          const wb = XLSX.read(ev.target.result, {type:'binary'});
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''});
          const cleaned = rows.filter(r=>r.some(cell=>String(cell).trim()!==''));
          const smart = parsePlanejamentoEscalaRows(cleaned);
          const split = smart || splitHeaderAndData(cleaned);

          if(split.smart && split.empresaMeta) wiz.empresaGeral = split.empresaMeta;
          if(split.headerless) toast('A primeira linha do arquivo parece ser um dado (ex: CPF), não um título — foi incluída como registro.','info');
          if(split.smart){

            toast('Relatório de Escala reconhecido: '+split.rawRows.length+' diarista(s)'+quando+'.'+conf,'ok');

  function processarLinhas(){
    const colByField = {};
    Object.entries(wiz.mapping).forEach(([col,field])=>{ if(field) colByField[field]=Number(col); });
    const seenInBatch = new Set(); // cpf+data+turno
    const rows = wiz.rawRows.map((r)=>{
      const get = f => colByField[f]!==undefined ? String(r[colByField[f]]||'').trim() : '';
      const nome = get('nome');
      const cpfRaw = get('cpf');
      const cpf = normalizeCPF(cpfRaw);
      const dataRaw = get('data');
      const dh = splitDataHoraEscala(dataRaw);
      let horario = get('horario_entrada') || dh.hora;
      let turno = (get('turno')||wiz.turnoGeral||'').toUpperCase().trim();
      if(!turno && horario) turno = turnoPorHorario(horario);
      const empresaArquivo = (get('empresa')||wiz.empresaGeral||'').toUpperCase().trim();
      const groot = get('groot_id');
      const cargoArquivo = get('cargo');
      // A data ao lado do nome é a data REAL em que o diarista vai trabalhar.
      // O fato de a convocação/lista ser feita no dia anterior não altera essa data.
      const data = dh.data || (dataRaw ? normalizeDateInput(dataRaw) : wiz.dataGeral);

      if(!nome && !cpf){
        return {status:'erro', motivo:'Sem nome e sem CPF', nome, cpf, turno, horario, empresa:empresaArquivo, groot, cargo:cargoArquivo||'Diarista', data};
      }
      if(cpfRaw && cpf.length!==11){
        return {status:'erro', motivo:`CPF com ${cpf.length} dígito(s) — deveria ter 11. Confira se o Excel não removeu zeros à esquerda (formate a coluna como Texto).`, nome, cpf, turno, horario, empresa:empresaArquivo, groot, cargo:cargoArquivo||'Diarista', data};
      }
      let match = cpf ? findDiaristaByCPF(cpf) : null;
      if(!match && nome) match = findDiaristaByName(nome);

      const key = (cpf||normalizeName(nome))+'|'+data+'|'+turno;
      let status = match ? 'encontrado' : 'novo';
      let dupInfo = '';
      if(seenInBatch.has(key)){ status='duplicidade'; dupInfo='Já presente nesta listagem (mesmo CPF/nome, data e turno).'; }
      else {
        const existsHist = HISTORICO.find(h=> (cpf? normalizeCPF(h.cpf)===cpf : normalizeName(h.nome)===normalizeName(nome)) && h.data===data && h.turno===turno);
        if(existsHist){ status='duplicidade'; dupInfo='Já existe um lançamento igual no histórico (CPF/nome + data + turno).'; }
      }
      seenInBatch.add(key);

      return {
        status, dupInfo, include: status!=='erro',
        // Se já existe no Banco, os dados cadastrais do Banco prevalecem. O arquivo serve para reconhecer a pessoa e o dia/horário.
        nome: match?match.nome:nome,
        cpf: match?match.cpf:cpf,
        turno, horario,
        empresa: 'TSI',
        groot: match?(match.groot_id||''):groot,
        cargo: match?(match.cargo||'Diarista'):(cargoArquivo||'Diarista'),
        data,
        diarista_id: match?match.id:null,
      };
    });
    wiz.processed = rows;
  }
  function normalizeDateInput(v){
    v = v.trim();
    if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
    const m = v.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
    if(m){ let [_,d,mo,y]=m; if(y.length===2) y='20'+y; return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`; }
    return wiz.dataGeral || '';
  }

          <div class="field mb0"><label>Aplicar Empresa a todas as linhas</label><input id="bulkEmpresa" list="empresasList3" value="TSI" placeholder="TSI"><datalist id="empresasList3">${empresasUsadas().map(e=>`<option value="${e}">`).join('')}</datalist></div>

      </div>
      <div class="table-wrap"><table><thead><tr><th>Incluir</th><th>Nome</th><th>CPF</th><th>Status</th><th>GROOT ID</th><th>Empresa *</th><th>Turno *</th><th>Entrada</th><th>Data</th></tr></thead>
      <tbody>${rows.map((r,i)=>`<tr class="${r.status==='novo'?'kn-row-novo':''}">
        <td><input type="checkbox" data-inc="${i}" ${r.include?'checked':''} ${r.status==='erro'?'disabled':''}></td>
        <td>${esc(r.nome)||'<span class="muted">—</span>'}</td>
        <td>${r.cpf?formatCPF(r.cpf):'<span class="muted">—</span>'}</td>
        <td><span class="pill ${r.status}">${r.status.toUpperCase()}</span>${r.dupInfo?`<div class="small muted">${esc(r.dupInfo)}</div>`:''}${r.status==='erro'?`<div class="small muted">${esc(r.motivo)}</div>`:''}</td>
        <td>${r.status==='novo'?`<input data-groot="${i}" style="width:90px;" value="${esc(r.groot)}" placeholder="GROOT ID" title="Diarista não está no Banco — informe o GROOT ID para completar o cadastro">`:(esc(r.groot)||'-')}</td>
        <td><input data-empresa="${i}" list="empresasList3" style="width:90px;" value="${esc(r.empresa)}" placeholder="definir"></td>
        <td><select data-turno="${i}" style="width:70px;"><option value="">—</option>${['T1','T2','T3'].map(t=>`<option ${r.turno===t?'selected':''}>${t}</option>`).join('')}</select></td>
        <td style="white-space:nowrap;">

      <div class="flex between mt16">
        <button class="btn secondary" id="back2">&larr; Voltar</button>
        <button class="btn" id="toStep4">Confirmar e salvar importação</button>
      </div>
    `;
    body.querySelectorAll('[data-inc]').forEach(cb=>cb.onchange=()=>{ rows[Number(cb.dataset.inc)].include = cb.checked; step3(); });
    body.querySelectorAll('[data-empresa]').forEach(inp=>inp.onchange=()=>{ rows[Number(inp.dataset.empresa)].empresa = inp.value.trim().toUpperCase(); step3(); });
    body.querySelectorAll('[data-turno]').forEach(sel=>sel.onchange=()=>{ rows[Number(sel.dataset.turno)].turno = sel.value; step3(); });
    body.querySelectorAll('[data-groot]').forEach(inp=>inp.onchange=()=>{ rows[Number(inp.dataset.groot)].groot = inp.value.trim(); });
    body.querySelectorAll('[data-horario]').forEach(inp=>inp.onchange=()=>{ rows[Number(inp.dataset.horario)].horario = inp.value.trim(); });
    body.querySelectorAll('[data-data]').forEach(inp=>inp.onchange=()=>{ rows[Number(inp.dataset.data)].data = inp.value; });
    body.querySelectorAll('[data-fromhere]').forEach(el=>{
      el.onclick = ()=>{
        const i = Number(el.dataset.fromhere);
        const inputAtual = body.querySelector(`[data-horario="${i}"]`);
        const valor = (inputAtual ? inputAtual.value : rows[i].horario || '').trim();
        if(!valor){ toast('Digite um horário nesta linha antes de aplicar para baixo.','warn'); return; }
        for(let k=i; k<rows.length; k++){ rows[k].horario = valor; }
        step3();
      };
    });
    body.querySelector('#bulkApply').onclick = ()=>{
      const t = body.querySelector('#bulkTurno').value;
      const e = body.querySelector('#bulkEmpresa').value.trim().toUpperCase();
      const h = body.querySelector('#bulkHorario').value.trim();
      const d = body.querySelector('#bulkData').value;
      rows.forEach(r=>{ if(t) r.turno=t; if(e) r.empresa=e; if(h) r.horario=h; if(d) r.data=d; });
      step3();
    };
    body.querySelector('#back2').onclick = ()=>{ wiz.step=2; navigate(); };
    body.querySelector('#toStep4').onclick = async (ev)=>{
      const toSave = rows.filter(r=>r.include && r.status!=='erro');
      const incompletas = toSave.filter(r=>!r.empresa || !r.turno || !r.data);
      if(incompletas.length){ toast(incompletas.length+' linha(s) sem Empresa, Turno ou Data de trabalho — preencha antes de salvar.','err'); return; }
      ev.target.disabled = true; ev.target.textContent = 'Salvando...';
      let novos=0, salvos=0;
      const falhas = [];
      const novosNaSessao = {}; // chave cpf-ou-nome -> diarista_id recém-criado nesta importação
      for(const r of toSave){
        let diaristaId = r.diarista_id;
        const chave = r.cpf || normalizeName(r.nome);
        if(!diaristaId && novosNaSessao[chave]) diaristaId = novosNaSessao[chave];
        if(!diaristaId){
          const now = new Date().toISOString();
          const inserted = await sbInsert('diaristas', {nome:r.nome, cpf:r.cpf, empresa:'TSI', groot_id:r.groot, cargo:r.cargo, status:'Ativo', nome_normalizado:normalizeName(r.nome), created_at:now, updated_at:now});
          if(!inserted){
            // pode já existir com esse CPF (conflito de unicidade) — tenta localizar antes de desistir da linha
            let existente = findDiaristaByCPF(r.cpf);
            if(!existente){
              // cache local (DIARISTAS) pode estar desatualizada — confirma direto no banco antes de desistir
              existente = await sbFindDiaristaByCPF(r.cpf);
              if(existente) DIARISTAS.push(existente); // atualiza cache local pro resto desta importação
            }
            if(existente){ diaristaId = existente.id; }
            else { falhas.push(`${r.nome||r.cpf} — CPF já cadastrado, mas não foi possível localizar o registro`); continue; }
          } else {
            DIARISTAS.push(inserted); diaristaId = inserted.id; novosNaSessao[chave] = diaristaId; novos++;
          }
        }
        // Pega o Ext (LDAP) do cadastro nesse momento e grava junto do lançamento, pra ficar
        // salvo permanentemente (não recalculado depois, caso o cadastro mude no futuro).
        const diaristaCad = DIARISTAS.find(x=>x.id===diaristaId);
        const ldap = (diaristaCad && diaristaCad.ext) || '';
        const histRow = await sbInsert('historico_diarias', {diarista_id:diaristaId, data:r.data, dia_semana:diaSemana(r.data), turno:r.turno, horario_entrada:r.horario, cpf:r.cpf, nome:r.nome, groot_id:r.groot, empresa:'TSI', cargo:r.cargo, ldap, created_at:new Date().toISOString()});
        if(!histRow){ falhas.push(`${r.nome||r.cpf} (${fmtDateBR(r.data)}, ${r.turno}) — falha ao gravar o lançamento`); continue; }
        HISTORICO.push(histRow);
        salvos++;
      }
      await sbInsert('importacoes', {nome_arquivo:'Importação manual', data_importacao:new Date().toISOString(), quantidade_registros:salvos, usuario:'operador', status:'concluída'});
      const naoIncluidos = rows.length - toSave.length;
      let msg = `${salvos} de ${rows.length} linha(s) da lista foram salvas no histórico, sendo ${novos} novo(s) diarista(s) cadastrado(s).`;
      if(naoIncluidos>0) msg += ` ${naoIncluidos} linha(s) não foram incluídas por estarem como Duplicidade/Erro ou desmarcadas na conferência.`;
      if(falhas.length) msg += ` ⚠️ ${falhas.length} linha(s) falharam ao gravar no banco: ${falhas.join('; ')}.`;
      wiz.resultMsg = msg;
      wiz.resultOk = falhas.length===0;
      wiz.step=4; navigate();
    };
  }

  function step4(){
    body.innerHTML = `
      <div class="alert ${wiz.resultOk===false?'warn':'ok'}">${wiz.resultOk===false?'🟡 Importação concluída com atenção:':'🟢 Importação concluída com sucesso!'}<br>${esc(wiz.resultMsg||'')}</div>
      <button class="btn" id="novaImportacao">Nova importação</button>
      <button class="btn secondary" id="verDash" style="margin-left:8px;">Ver Dashboard</button>
    `;
    body.querySelector('#novaImportacao').onclick = ()=>{ renderImportar._wiz=null; navigate(); };
    body.querySelector('#verDash').onclick = ()=>{ renderImportar._wiz=null; currentView='dashboard'; navigate(); };
  }
}

// Ao editar o campo ABS de um dia, salva na mesma tabela distribuicao_diaria (junto com
// MELI/KN), sem mexer nos outros campos. Só soma o número digitado — sem precisar registrar
// diarista por diarista.
function attachAbsInputHandler(container){
  container.addEventListener('change', async (e)=>{
    const inp = e.target.closest('.abs-input');
    if(!inp) return;
    const dataISO = inp.dataset.data;
    let val = parseInt(inp.value);
    if(isNaN(val) || val<0) val = 0;
    inp.value = val;
    const existente = distDia(dataISO);
    const patch = {abs: val, updated_at:new Date().toISOString()};
    let ok;
    if(existente){
      const upd = await sbUpdate('distribuicao_diaria', existente.id, patch);
      ok = !!upd;
      if(ok) Object.assign(existente, patch);
    } else {
      const inserted = await sbInsert('distribuicao_diaria', {data:dataISO, meli:0, kn:0, ...patch});
      ok = !!inserted;
      if(ok) DIST_DIARIA.push(inserted);
    }
    if(ok) toast('ABS de '+fmtDateBR(dataISO)+' salva.','ok');
  });
}

// Exportação profissional (Excel com formatação) do Controle Diário do período — usada pela
// gerência para fechamento de fatura. Usa ExcelJS (carregado via CDN) para aplicar cores,
// negrito e bordas, o que a biblioteca xlsx básica usada no resto do sistema não suporta.
async function exportControleExcel(ini, fim){
  const datas = Array.from(new Set(HISTORICO.filter(h=>h.data>=ini && h.data<=fim).map(h=>h.data))).sort();
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Faltas ABS');
  ws.columns = [{width:18},{width:34},{width:22},{width:16},{width:22},{width:14},{width:16},{width:12}];
  ws.mergeCells('A1:H1');
  ws.getCell('A1').value = 'KUEHNE+NAGEL — Relatório Fatura';
  ws.getCell('A1').font = {size:14,bold:true,color:{argb:'FFFFFFFF'}};
  ws.getCell('A1').fill = {type:'pattern',pattern:'solid',fgColor:{argb:'FF003B5C'}};
  ws.getCell('A1').alignment = {vertical:'middle',horizontal:'left'};
  ws.getRow(1).height=26;
  ws.mergeCells('A2:H2');
  ws.getCell('A2').value = `Período: ${fmtDateBR(ini)} a ${fmtDateBR(fim)} · Gerado em ${fmtDateBR(todayISO())}`;
  ws.getCell('A2').font={size:10,italic:true,color:{argb:'FF44586A'}};
  ws.getRow(3).height=6;
  const header=ws.getRow(4);
  header.values=['Groot ID','Nome','Empresa','Cargo','Escala','Data','Qtd. Diarista','Qtd. ABS'];
  header.eachCell(cell=>{cell.font={bold:true,color:{argb:'FFFFFFFF'}};cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF00A3E0'}};cell.alignment={vertical:'middle',horizontal:'center'};});
  let r=5;
  datas.forEach(d=>{
    const regs=registrosDoDia(d), totalDia=regs.length, dd=distDia(d), abs=dd?(dd.abs||0):0;
    regs.forEach((h,idx)=>{
      const cad=(h.diarista_id&&DIARISTAS.find(x=>x.id===h.diarista_id))||findDiaristaByCPF(h.cpf)||{};
      const row=ws.getRow(r++);
      row.values=[h.groot_id||cad.groot_id||'',h.nome||cad.nome||'',h.empresa||cad.empresa||'','Diarista',h.escala||cad.escala||h.turno||'',fmtDateBR(d),totalDia,idx===0?abs:''];
      row.eachCell((cell,col)=>{cell.alignment={vertical:'middle',horizontal:[1,6,7,8].includes(col)?'center':'left'};cell.border={bottom:{style:'thin',color:{argb:'FFD9E2E8'}}};});
    });
  });
  if(!datas.length){ws.mergeCells(`A${r}:H${r}`);ws.getCell(`A${r}`).value='Nenhum dado no período selecionado.';}
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url;a.download=`faltas_abs_${ini}_a_${fim}.xlsx`;a.click();URL.revokeObjectURL(url);
  toast('Excel exportado com sucesso.','ok');
}

// Monta, pro modelo do outro sistema, a lista de pessoas únicas lançadas num período — Nome,
// MATRIZ (fixo), SVC (fixo), ID GROOT e LDAP. LDAP vem do que foi gravado junto do lançamento
// (h.ldap), que é o valor de Ext que o cadastro tinha naquele dia; só cai pro cadastro atual em
// lançamentos antigos, de antes desse campo existir.
function pessoasNoPeriodo(iniISO, fimISO){
  const registros = HISTORICO.filter(h=>h.data>=iniISO && h.data<=fimISO);
  const vistos = new Set();
  const pessoas = [];
  registros.forEach(h=>{
    const d = (h.diarista_id && DIARISTAS.find(x=>x.id===h.diarista_id)) || findDiaristaByCPF(h.cpf);
    const chave = (h.cpf || (d && d.cpf) || normalizeName(h.nome));
    if(vistos.has(chave)) return;
    vistos.add(chave);
    pessoas.push({
      nome: h.nome || (d && d.nome) || '',
      matriz: 'CORDOVIL',
      svc: 'SRJ1',
      groot_id: h.groot_id || (d && d.groot_id) || '',
      ldap: h.ldap || (d && d.ext) || ''
    });
  });
  return pessoas.sort((a,b)=>a.nome.localeCompare(b.nome));
}

// Exporta, no modelo de importação do outro sistema (colunas: Nome Completo *, MATRIZ *, SVC,
// ID GROOT, LDAP), as pessoas que trabalharam num período — uma linha por pessoa, sem repetir
// mesmo que tenha mais de um lançamento no período. MATRIZ e SVC são fixos (CORDOVIL / SRJ1).
function exportModeloOutroSistema(iniISO, fimISO){
  const pessoas = pessoasNoPeriodo(iniISO, fimISO);
  if(!pessoas.length){ toast('Nenhum lançamento encontrado nesse período.','err'); return; }
  const linhas = pessoas.map(p=>({
    'Nome Completo *': p.nome,
    'MATRIZ *': p.matriz,
    'SVC': p.svc,
    'ID GROOT': p.groot_id,
    'LDAP': p.ldap
  }));
  const wb = XLSX.utils.book_new();
  const wsDiaristas = XLSX.utils.json_to_sheet(linhas, {header:['Nome Completo *','MATRIZ *','SVC','ID GROOT','LDAP']});
  XLSX.utils.book_append_sheet(wb, wsDiaristas, 'Diaristas');
  const wsListas = XLSX.utils.aoa_to_sheet([['Matriz','SVC'], ['CORDOVIL','SRJ1']]);
  XLSX.utils.book_append_sheet(wb, wsListas, 'Listas');
  const sufixo = iniISO===fimISO ? iniISO : `${iniISO}_a_${fimISO}`;
  XLSX.writeFile(wb, `importacao_diaristas_${sufixo}.xlsx`);
  toast(`Exportação gerada com ${linhas.length} pessoa(s): importacao_diaristas_${sufixo}.xlsx`, 'ok');
}

async function limparDistribuicaoOrfa(datas){
  for(const d of datas){
    if(registrosDoDia(d).length>0) continue;
    const dd = distDia(d);
    if(!dd) continue;
    const ok = await sbDelete('distribuicao_diaria', dd.id);
    if(ok) DIST_DIARIA = DIST_DIARIA.filter(x=>x.id!==dd.id);
  }
}

/* ===================== HISTÓRICO ===================== */
function renderHistorico(c){
  const state = renderHistorico._state || {ini:'', fim:'', cpf:'', nome:'', groot:'', empresa:'', turno:'', cargo:'', dia:''};
  renderHistorico._state = state;
  // Mantém as marcações mesmo quando a tela é redesenhada/atualizada automaticamente.
  const selecionados = renderHistorico._selecionados || new Set();
  renderHistorico._selecionados = selecionados;
  const panel = document.createElement('div');
  panel.className='panel';
  panel.innerHTML = `
    <h2>Filtros</h2>
    <div class="grid4">
      <div class="field"><label>Data inicial</label><input type="date" id="fIni" value="${state.ini}"></div>
      <div class="field"><label>Data final</label><input type="date" id="fFim" value="${state.fim}"></div>
      <div class="field"><label>CPF</label><input id="fCpf" value="${esc(state.cpf)}"></div>
      <div class="field"><label>Nome</label><input id="fNome" value="${esc(state.nome)}"></div>
      <div class="field"><label>GROOT ID</label><input id="fGroot" value="${esc(state.groot)}"></div>
      <div class="field"><label>Empresa</label><select id="fEmpresa"><option value="">Todas</option>${empresasUsadas().map(e=>`<option ${state.empresa===e?'selected':''}>${e}</option>`).join('')}</select></div>
      <div class="field"><label>Turno</label><select id="fTurno"><option value="">Todos</option>${['T1','T2','T3'].map(t=>`<option ${state.turno===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="field"><label>Dia da semana</label><select id="fDia"><option value="">Todos</option>${DIAS_SEMANA.map(d=>`<option ${state.dia===d?'selected':''}>${d}</option>`).join('')}</select></div>
    </div>
    <div class="flex gap8" style="flex-wrap:wrap;">
      <button class="btn sm" id="applyFilters">Aplicar filtros</button>
      <button class="btn secondary sm" id="clearFilters">Limpar</button>
      <button class="btn secondary sm" id="expHist">Exportar CSV</button>
      <button class="btn secondary sm" id="delSelected" style="margin-left:auto;color:var(--red);border-color:var(--red);" disabled>Excluir selecionados (0)</button>
    </div>
    <div class="table-wrap mt16" id="hTable"></div>
  `;
  c.appendChild(panel);
  function getFiltered(){
    return HISTORICO.filter(h=>{
      if(state.ini && h.data<state.ini) return false;
      if(state.fim && h.data>state.fim) return false;
      if(state.cpf && !onlyDigits(h.cpf).includes(onlyDigits(state.cpf))) return false;
      if(state.nome && !normalizeName(h.nome).includes(normalizeName(state.nome))) return false;
      if(state.groot && !(h.groot_id||'').includes(state.groot)) return false;
      if(state.empresa && h.empresa!==state.empresa) return false;
      if(state.turno && h.turno!==state.turno) return false;
      if(state.dia && diaSemana(h.data)!==state.dia) return false;
      return true;
    }).sort((a,b)=>b.data.localeCompare(a.data));
  }
  function updateDelBtn(){
    const btn = panel.querySelector('#delSelected');
    btn.textContent = `Excluir selecionados (${selecionados.size})`;
    btn.disabled = selecionados.size===0;
  }
  function draw(){
    const list = getFiltered();
    const visiveis = list.slice(0,500);
    document.getElementById('hTable').innerHTML = `
      <table><thead><tr><th><input type="checkbox" id="selAllHist"></th><th>Data</th><th>Dia</th><th>Nome</th><th>CPF</th><th>GROOT ID</th><th>Empresa</th><th>Cargo</th><th>Turno</th><th>Entrada</th><th></th></tr></thead>
      <tbody>${visiveis.length?visiveis.map(h=>`<tr><td><input type="checkbox" class="rowSel" data-id="${h.id}" ${selecionados.has(h.id)?'checked':''}></td><td>${fmtDateBR(h.data)}</td><td>${diaSemana(h.data)}</td><td><span class="link" data-d="${h.diarista_id}">${esc(h.nome)}</span></td><td>${formatCPF(h.cpf)}</td><td>${esc(h.groot_id||'-')}</td><td><span class="pill empresa">${esc(h.empresa)}</span></td><td>${esc(h.cargo)}</td><td>${esc(h.turno)}</td><td>${esc(h.horario_entrada)}</td><td><span class="link small" data-del="${h.id}">excluir</span></td></tr>`).join(''):'<tr><td colspan="11" class="muted">Nenhum registro encontrado.</td></tr>'}</tbody></table>
      ${list.length>500?`<div class="muted small mt8">Mostrando 500 de ${list.length} registros. Refine os filtros para ver mais detalhes.</div>`:''}
    `;
    document.getElementById('hTable').querySelectorAll('[data-d]').forEach(el=>el.addEventListener('click',()=>{ if(el.dataset.d){currentView='banco'; fichaDiaristaId=el.dataset.d; navigate();} }));
    document.getElementById('hTable').querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click', async ()=>{
      if(!confirm('Excluir este lançamento do histórico? Esta ação não pode ser desfeita.')) return;
      const ok = await sbDelete('historico_diarias', el.dataset.del);
      if(!ok) return;
      const registro = HISTORICO.find(h=>h.id===el.dataset.del);
      HISTORICO = HISTORICO.filter(h=>h.id!==el.dataset.del);
      selecionados.delete(el.dataset.del);
      if(registro) await limparDistribuicaoOrfa([registro.data]);
      toast('Lançamento excluído.','ok');
      draw();
      updateDelBtn();
    }));
    const selAll = document.getElementById('selAllHist');
    selAll.checked = visiveis.length>0 && visiveis.every(h=>selecionados.has(h.id));
    selAll.onchange = ()=>{
      visiveis.forEach(h=>{ if(selAll.checked) selecionados.add(h.id); else selecionados.delete(h.id); });
      draw();
      updateDelBtn();
    };
    document.getElementById('hTable').querySelectorAll('.rowSel').forEach(cb=>cb.addEventListener('change', ()=>{
      if(cb.checked) selecionados.add(cb.dataset.id); else selecionados.delete(cb.dataset.id);
      updateDelBtn();
      selAll.checked = visiveis.length>0 && visiveis.every(h=>selecionados.has(h.id));
    }));
  }
  draw();
  updateDelBtn();

  // Salva o filtro assim que o usuário altera o campo. Isso evita perder a data
  // quando a atualização automática de 15s reconstrói a tela.
  function syncFilters(redraw=true){
    state.ini=panel.querySelector('#fIni').value; state.fim=panel.querySelector('#fFim').value;
    state.cpf=panel.querySelector('#fCpf').value; state.nome=panel.querySelector('#fNome').value;
    state.groot=panel.querySelector('#fGroot').value; state.empresa=panel.querySelector('#fEmpresa').value;
    state.turno=panel.querySelector('#fTurno').value; state.dia=panel.querySelector('#fDia').value;
    if(redraw) draw();
  }
  panel.querySelectorAll('#fIni,#fFim,#fEmpresa,#fTurno,#fDia').forEach(el=>el.addEventListener('change', ()=>syncFilters(true)));
  panel.querySelectorAll('#fCpf,#fNome,#fGroot').forEach(el=>el.addEventListener('input', ()=>syncFilters(false)));
  panel.querySelector('#applyFilters').onclick = ()=>syncFilters(true);
  panel.querySelector('#clearFilters').onclick = ()=>{
    renderHistorico._state={ini:'', fim:'', cpf:'', nome:'', groot:'', empresa:'', turno:'', cargo:'', dia:''};
    selecionados.clear();
    navigate();
  };
  panel.querySelector('#expHist').onclick = ()=>{
    const list = getFiltered();
    exportCSV('historico.csv', ['Data','Dia','Nome','CPF','GROOT ID','Empresa','Cargo','Turno','Entrada'],
      list.map(h=>[fmtDateBR(h.data), diaSemana(h.data), h.nome, formatCPF(h.cpf), h.groot_id||'', h.empresa, h.cargo, h.turno, h.horario_entrada]));
  };
  panel.querySelector('#delSelected').onclick = async ()=>{
    if(selecionados.size===0) return;
    if(!confirm(`Excluir ${selecionados.size} lançamento(s) selecionado(s) do histórico? Esta ação não pode ser desfeita.`)) return;
    const ids = Array.from(selecionados);
    const datasAfetadas = new Set();
    let ok=0;
    for(const id of ids){
      const registro = HISTORICO.find(h=>h.id===id);
      const r = await sbDelete('historico_diarias', id);
      if(r){ ok++; HISTORICO = HISTORICO.filter(h=>h.id!==id); if(registro) datasAfetadas.add(registro.data); }
    }
    selecionados.clear();
    await limparDistribuicaoOrfa(Array.from(datasAfetadas));
    toast(ok+' lançamento(s) excluído(s).','ok');
    draw();
    updateDelBtn();
  };
}

// Diaristas acima, aqui NÃO deduplica por pessoa, pois o modelo é de lançamentos diários.
// Data, Empresa, Turno, Nome, ID GROOT e MATRIZ/SVC vêm do histórico; Motivo, Solicitado Por,
// Autorizado Por e Grupo são preenchidos uma vez na tela e aplicados a todas as linhas do período.
function lancamentosNoPeriodo(iniISO, fimISO){
  return HISTORICO.filter(h=>h.data>=iniISO && h.data<=fimISO)
    .slice()
    .sort((a,b)=> a.data===b.data ? (a.nome||'').localeCompare(b.nome||'') : a.data.localeCompare(b.data))
    .map(h=>({
      data: h.data,
      empresa: h.empresa || '',
      turno: h.turno || '',
      nome: h.nome || '',
      groot_id: h.groot_id || '',
      matriz: 'CORDOVIL',
      svc: 'SRJ1'
    }));
}

// Gera o .xlsx exatamente no formato de modelo_importacao_lancamentos.xlsx: aba "Lancamentos"
// (uma linha por diarista/dia no período) + aba "Listas" com as opções de Motivo/Turno/Parte/Matriz/SVC,
// copiada do próprio modelo enviado.
function exportLancamentosXlsx(iniISO, fimISO, extras){
  const linhas = lancamentosNoPeriodo(iniISO, fimISO);
  if(!linhas.length){ toast('Nenhum lançamento encontrado nesse período.','err'); return; }
  if(!extras.motivo){ toast('Selecione o Motivo antes de exportar.','err'); return; }

  const header = ['Data *','Empresa *','Motivo *','Turno *','Solicitado Por','Autorizado Por','MATRIZ *','SVC','Nome Diarista *','ID GROOT','Grupo'];
  const dados = linhas.map(l=>({
    'Data *': fmtDateBR(l.data),
    'Empresa *': l.empresa,
    'Motivo *': extras.motivo,
    'Turno *': l.turno,
    'Solicitado Por': extras.solicitado,
    'Autorizado Por': extras.autorizado,
    'MATRIZ *': l.matriz,
    'SVC': l.svc,
    'Nome Diarista *': l.nome,
    'ID GROOT': l.groot_id,
    'Grupo': extras.grupo
  }));

  const wb = XLSX.utils.book_new();
  const wsLanc = XLSX.utils.json_to_sheet(dados, {header});
  XLSX.utils.book_append_sheet(wb, wsLanc, 'Lancamentos');

  const wsListas = XLSX.utils.aoa_to_sheet([
    ['Motivo','Turno','Parte','Matriz','SVC'],
    ['ADEQUAÇÃO DE QUADRO','T1','KUEHNE + NAGEL','CORDOVIL','SRJ1'],
    ['ABSENTEÍSMO','T2','MERCADO LIVRE','',''],
    ['VOLUME ACIMA DO PREVISTO','T3','','',''],
    ['PULMÃO KN','','','',''],
  ]);
  XLSX.utils.book_append_sheet(wb, wsListas, 'Listas');

  const sufixo = iniISO===fimISO ? iniISO : `${iniISO}_a_${fimISO}`;
  XLSX.writeFile(wb, `lancamentos_${sufixo}.xlsx`);
  toast(`Exportação gerada com ${linhas.length} lançamento(s): lancamentos_${sufixo}.xlsx`, 'ok');
}

// Converte "AAAA-MM" no primeiro e último dia daquele mês (formato ISO), pra filtrar HISTORICO.
function mesParaIntervalo(m){
  const [ano, mes] = m.split('-').map(Number);
  const ultimoDia = new Date(ano, mes, 0).getDate();
  return [`${m}-01`, `${m}-${String(ultimoDia).padStart(2,'0')}`];
}

function exportCSV(filename, header, rows){
  const esc2 = v => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const csv = [header.map(esc2).join(';'), ...rows.map(r=>r.map(esc2).join(';'))].join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
  toast('Exportação gerada: '+filename,'ok');
}

});
(function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('kn-diaristas-theme'); }catch(e){}
  applyTheme(saved === 'dark');
})();

async function boot(){
  document.getElementById('content').innerHTML = '<div class="panel">Carregando dados do banco...</div>';
  [DIARISTAS, HISTORICO, IMPORTS, DIST_DIARIA] = await Promise.all([sbSelect('diaristas'), sbSelect('historico_diarias'), sbSelect('importacoes'), sbSelect('distribuicao_diaria')]);
  // Sincroniza cada lançamento do histórico com os dados MAIS ATUAIS do diarista
  // (nome, GROOT ID, empresa, cargo). O histórico guarda uma cópia desses dados no
  // momento do lançamento; se o cadastro for completado/corrigido depois (ex: GROOT ID
  // que faltava), essa cópia antiga ficaria desatualizada — aqui ela é sempre atualizada
  // com o que está no Banco de Diaristas, em todas as telas (Dashboard, Controle Diário,
  // Histórico, Relatórios).
  const diaristasPorId = {};
  DIARISTAS.forEach(d=>{ diaristasPorId[d.id] = d; });
  HISTORICO = HISTORICO.map(h=>{
    const atual = h.diarista_id ? diaristasPorId[h.diarista_id] : null;
    if(!atual) return h;
    return {
      ...h,
      nome: atual.nome || h.nome,
      groot_id: atual.groot_id || h.groot_id,
      empresa: atual.empresa || h.empresa,
      cargo: atual.cargo || h.cargo,
      cpf: atual.cpf || h.cpf,
    };
  });
  LOADED = true;
  // limpa registros de distribuição MELI/KN órfãos (sem nenhum lançamento correspondente no histórico)
  const orfaos = DIST_DIARIA.filter(d=>registrosDoDia(d.data).length===0);
  for(const orfao of orfaos){
    const ok = await sbDelete('distribuicao_diaria', orfao.id);
    if(ok) DIST_DIARIA = DIST_DIARIA.filter(x=>x.id!==orfao.id);
  }
  navigate();
}
boot();

// Atualização automática (a cada 15s) do Dashboard e do Controle Diário/Faltas: busca de novo
// o histórico e as ABS lançadas — assim, quando alguém confirma entrada/saída pelo QR Diaristas
// ou registra uma ABS (dessa ou de outra sessão), a informação aparece aqui sozinha, sem precisar
// recarregar a página.
setInterval(async ()=>{
  if(!LOADED || (currentView!=='dashboard' && currentView!=='controle')) return;
  try{
    const freshHist = await sbSelect('historico_diarias');
    const diaristasPorId = {};
    DIARISTAS.forEach(d=>{ diaristasPorId[d.id] = d; });
    HISTORICO = freshHist.map(h=>{
      const atual = h.diarista_id ? diaristasPorId[h.diarista_id] : null;
      if(!atual) return h;
      return {
        ...h,
        nome: atual.nome || h.nome,
        groot_id: atual.groot_id || h.groot_id,
        empresa: atual.empresa || h.empresa,
        cargo: atual.cargo || h.cargo,
        cpf: atual.cpf || h.cpf,
      };
    });
    if(currentView==='dashboard' || currentView==='controle') navigate();
  }catch(e){ /* falha silenciosa — tenta de novo no próximo ciclo */ }
}, 15000);

if(window.parent !== window){
  document.getElementById('sidebar').style.display = 'none';
  window.addEventListener('message', (e)=>{
    const d = e.data;
    if(d && d.app==='painel-kn' && d.action==='navigate' && VIEWS.some(v=>v.id===d.target)){
      currentView = d.target;
      fichaDiaristaId = null;
      navigate();
    }
  });
}
</script>
